<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - DS SnackBox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <a href="/" class="logo">⚡ DS SnackBox</a>
        <nav><a href="/">Home</a><a href="/cart">Cart 🛒 <span id="cart-count"></span></a><a href="/reviews" class="active">Reviews ⭐</a></nav>
    </header>
    <main>
        <div class="box">
            <h2>⭐ Customer Reviews</h2>
            <p style="color:#64748b;font-size:0.85rem;margin-bottom:10px;">Share your snack experience</p>
            <input type="text" id="r-name" placeholder="Your Name">
            <select id="r-rat">
                <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (Very Good)</option>
                <option value="3">⭐⭐⭐ (Good)</option>
                <option value="2">⭐⭐ (Fair)</option>
                <option value="1">⭐ (Poor)</option>
            </select>
            <textarea id="r-com" placeholder="Your feedback..." rows="2"></textarea>
            <button class="btn-sub" onclick="addRev()">Submit Review ✨</button>
            <h3 style="margin-top:18px;font-size:1rem;">Community Ratings</h3>
            <div id="rev-list"></div>
        </div>
    </main>
    <footer><p>⚡ DS SnackBox • Delivered in Minutes</p></footer>
    <script src="/static/script.js"></script>
</body>
</html>
