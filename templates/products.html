<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - DS SnackBox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <div class="logo">⚡ DS SnackBox</div>
        <nav>
            <a href="/">Home</a>
            <a href="/products" class="active">Menu</a>
            <a href="/cart">Cart 🛒 <span id="cart-count"></span></a>
        </nav>
    </header>

    <main>
        <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 4px;">Explore Snacks</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 16px;">Delivery in 10 minutes</p>

        <div class="product-container">
            <div class="card">
                <img src="/static/images/cookies.jpg" alt="Chocolate Cookies">
                <h3>Chocolate Cookies</h3>
                <div class="card-footer">
                    <span class="price">₹120</span>
                    <div data-product="Chocolate Cookies" data-price="120"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/biscuits.jpg" alt="Butter Biscuits">
                <h3>Butter Biscuits</h3>
                <div class="card-footer">
                    <span class="price">₹80</span>
                    <div data-product="Butter Biscuits" data-price="80"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/cupcake.jpg" alt="Chocolate Cupcake">
                <h3>Chocolate Cupcake</h3>
                <div class="card-footer">
                    <span class="price">₹60</span>
                    <div data-product="Chocolate Cupcake" data-price="60"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/cake.jpg" alt="Chocolate Cake">
                <h3>Chocolate Cake</h3>
                <div class="card-footer">
                    <span class="price">₹450</span>
                    <div data-product="Chocolate Cake" data-price="450"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/snack.jpg" alt="Crispy Mixture">
                <h3>Crispy Mixture</h3>
                <div class="card-footer">
                    <span class="price">₹50</span>
                    <div data-product="Crispy Mixture" data-price="50"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/chips.jpg" alt="Potato Chips">
                <h3>Potato Chips</h3>
                <div class="card-footer">
                    <span class="price">₹40</span>
                    <div data-product="Potato Chips" data-price="40"></div>
                </div>
            </div>

            <div class="card">
                <img src="/static/images/coca_cola.jpg" alt="Coca Cola Can">
                <h3>Coca Cola Can</h3>
                <div class="card-footer">
                    <span class="price">₹35</span>
                    <div data-product="Coca Cola Can" data-price="35"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>⚡ DS SnackBox • Delivered in Minutes</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
