<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - DS SnackBox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <a href="/" class="logo">⚡ DS SnackBox</a>
        <nav>
            <a href="/">Home</a>
            <a href="/products" class="active">Menu</a>
            <a href="/cart">Cart 🛒 <span id="cart-count"></span></a>
        </nav>
    </header>

    <main>
        <div class="heading-row">
            <h2>Our Snack Menu</h2>
            <span style="font-size: 0.85rem; color:#6c757d;">Fast 10-min delivery</span>
        </div>

        <div class="grid">
            <div class="card">
                <div class="img-box"><img src="/static/images/cookies.jpg" alt="Chocolate Cookies"></div>
                <h4>Chocolate Cookies</h4>
                <div class="card-footer">
                    <span class="price">₹120</span>
                    <div data-product="Chocolate Cookies" data-price="120"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/biscuits.jpg" alt="Butter Biscuits"></div>
                <h4>Butter Biscuits</h4>
                <div class="card-footer">
                    <span class="price">₹80</span>
                    <div data-product="Butter Biscuits" data-price="80"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/cupcake.jpg" alt="Chocolate Cupcake"></div>
                <h4>Chocolate Cupcake</h4>
                <div class="card-footer">
                    <span class="price">₹60</span>
                    <div data-product="Chocolate Cupcake" data-price="60"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/cake.jpg" alt="Chocolate Cake"></div>
                <h4>Chocolate Cake</h4>
                <div class="card-footer">
                    <span class="price">₹450</span>
                    <div data-product="Chocolate Cake" data-price="450"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/snack.jpg" alt="Crispy Mixture"></div>
                <h4>Crispy Mixture</h4>
                <div class="card-footer">
                    <span class="price">₹50</span>
                    <div data-product="Crispy Mixture" data-price="50"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/chips.jpg" alt="Potato Chips"></div>
                <h4>Potato Chips</h4>
                <div class="card-footer">
                    <span class="price">₹40</span>
                    <div data-product="Potato Chips" data-price="40"></div>
                </div>
            </div>
            <div class="card">
                <div class="img-box"><img src="/static/images/coca_cola.jpg" alt="Coca Cola Can"></div>
                <h4>Coca Cola Can</h4>
                <div class="card-footer">
                    <span class="price">₹35</span>
                    <div data-product="Coca Cola Can" data-price="35"></div>
                </div>
            </div>
        </div>
    </main>

    <footer><p>⚡ DS SnackBox • Delivered in Minutes</p></footer>
    <script src="/static/script.js"></script>
</body>
</html>
