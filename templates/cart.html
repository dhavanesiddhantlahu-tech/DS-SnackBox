<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DS SnackBox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo">🍪 DS SnackBox</div>
        <nav>
            <a href="/">Home</a>
            <a href="/products">Menu</a>
            <a href="/cart" class="active">Cart 🛒</a>
        </nav>
    </header>

    <main class="cart-container">
        <h2>🛒 Your Cart</h2>
        <div id="cart-items" class="cart-list"></div>

        <div class="cart-total-section">
            <h3>Total: ₹<span id="cart-total">0</span></h3>
        </div>

        <section class="order-form-section">
            <h3>Order Details</h3>
            <div class="form-group">
                <input type="text" id="cust-name" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="tel" id="cust-phone" placeholder="Phone Number" required>
            </div>
            <div class="form-group">
                <textarea id="cust-address" placeholder="Delivery Address" rows="3" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="cust-payment">Payment Method</label>
                <select id="cust-payment">
                    <option value="Cash on Delivery">💵 Cash on Delivery</option>
                    <option value="UPI">📱 UPI / Online</option>
                </select>
            </div>

            <button type="button" class="btn-primary" onclick="placeOrder()">Place Order 🎉</button>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
