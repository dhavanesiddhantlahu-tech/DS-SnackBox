<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DS SnackBox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">🍪 DS SnackBox</div>
        <nav>
            <a href="/">Home</a>
            <a href="/products">Menu</a>
            <a href="/cart" class="active">Cart 🛒</a>
        </nav>
    </header>

    <div class="cart-container">
        <h2>🛒 Your Cart</h2>
        <div id="cart-items"></div>
        <h3 id="total-price">Total: ₹0</h3>

        <div class="order-form">
            <h3>Order Details</h3>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <textarea id="address" placeholder="Delivery Address" rows="3" required></textarea>
            
            <label for="payment" style="display:block; margin-top:10px; font-weight:bold;">Payment Method</label>
            <select id="payment">
                <option value="Cash on Delivery">💵 Cash on Delivery</option>
                <option value="UPI">📱 UPI</option>
            </select>

            <button class="order-btn" onclick="placeOrder()">Place Order 🎉</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
