<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DS SnackBox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="logo">🍪 DS SnackBox</div>
        <nav>
            <a href="/">Home</a>
            <a href="/products">Menu</a>
            <a href="/cart" class="active">Cart 🛒</a>
        </nav>
    </header>

    <div class="cart">
        <h2>🛒 Your Cart</h2>
        <div id="cart-items"></div>
        <h3 id="total-price">Total: ₹0</h3>

        <div class="order-form">
            <h3>Order Details</h3>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <textarea id="address" placeholder="Delivery Address" rows="3" required></textarea>
            
            <label for="payment" style="font-weight: bold; margin-top: 5px; color: #444;">Payment Method</label>
            <select id="payment">
                <option value="Cash on Delivery">💵 Cash on Delivery</option>
                <option value="Online Payment">📱 Online Payment</option>
            </select>

            <button onclick="placeOrder()">Place Order 🎉</button>
        </div>

        <div id="success"></div>
    </div>

    <footer>
        <h3>🍪 DS SnackBox</h3>
        <p>Snacks Made for Every Craving</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
